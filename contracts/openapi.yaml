openapi: 3.1.0
info:
  title: Zyncro API
  version: 0.1.0
  summary: Open-source accounts receivable API.
  description: |
    Contract-first source of truth for the Zyncro HTTP API. Every endpoint is
    designed here before it is implemented, and e2e tests validate real
    responses against these schemas.

    Conventions:
    - Every route requires a bearer JWT unless the operation sets `security: []`.
    - Every error response uses RFC 9457 Problem Details
      (`application/problem+json`) with two extensions: `instance` and
      `timestamp`.
    - Problem `type` values: `https://github.com/dev-eduardo-gomez/zyncro-api/blob/main/docs/errors.md#validation`
      for request validation, `https://github.com/dev-eduardo-gomez/zyncro-api/blob/main/docs/errors.md#{code}`
      for domain rule violations, and `about:blank` for plain HTTP errors (401, 403,
      404, 500).
    - JSON property names use camelCase; timestamps are ISO 8601 in UTC.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Same origin as the caller (local development runs on port 3000).
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Authentication and the current user's identity.
  - name: Customers
    description: Accounts receivable customers.
  - name: Invoices
    description: Internal invoices (no fiscal stamping; see #35 for that, deferred).
  - name: Payments
    description: Payments registered against an invoice.

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Exchange credentials for an access token
      description: |
        Public. An unknown email and a wrong password return the same 401 body,
        so the response does not reveal which emails exist.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: maker@example.com
              password: S3cure-Passw0rd!
      responses:
        '200':
          description: Credentials are valid; a stateless JWT was issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI...
                tokenType: Bearer
                expiresIn: 900
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: Unknown email or wrong password.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: Invalid email or password.
                instance: /auth/login
                timestamp: '2026-10-28T18:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Identity of the authenticated user
      description: Returns the claims carried by the bearer token. Any role may call it.
      responses:
        '200':
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUser'
              example:
                id: 8f14e45f-ceea-467f-a0e6-1b3c4d5e6f70
                email: maker@example.com
                role: MAKER
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /customers:
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Register a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreateRequest'
            example:
              taxId: 'TAX-00123456'
              legalName: Acme Corp
              address: 'Av. Siempre Viva 123, CDMX'
              contactEmail: billing@acme.test
              creditDays: 30
      responses:
        '201':
          description: Customer created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A customer with this `taxId` already exists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://github.com/dev-eduardo-gomez/zyncro-api/blob/main/docs/errors.md#customer-duplicate-tax-id
                title: Duplicate tax id
                status: 409
                detail: A customer with this taxId already exists.
                instance: /customers
                timestamp: '2026-11-02T18:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Customers]
      operationId: listCustomers
      summary: List customers
      responses:
        '200':
          description: All customers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /customers/{customerId}:
    parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Customers]
      operationId: getCustomer
      summary: Get a customer by id
      responses:
        '200':
          description: The customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Customers]
      operationId: updateCustomer
      summary: Update a customer's editable fields
      description: '`taxId` is immutable; it is not part of this request.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdateRequest'
      responses:
        '200':
          description: Customer updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /invoices:
    post:
      tags: [Invoices]
      operationId: createInvoice
      summary: Issue an internal invoice
      description: |
        No fiscal stamping (see #35, deferred). `dueDate` is computed from the
        customer's `creditDays`; `subtotal`, `tax` and `total` are computed
        from `lineItems` and are not accepted in the request.

        Rounding (R2), always half-up to 2 decimals:
        1. `lineTotal = round(quantity * unitPrice)` per line.
        2. `subtotal = sum(lineTotal)`, exact.
        3. `tax = round(sum(lineTotal * taxRate))`, rounded once per invoice, not per line.
        4. `total = subtotal + tax`, exact.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceCreateRequest'
            example:
              customerId: 8f14e45f-ceea-467f-a0e6-1b3c4d5e6f70
              currency: MXN
              lineItems:
                - description: Monthly subscription
                  quantity: 1
                  unitPrice: '1000.00'
                  taxRate: 0.16
      responses:
        '201':
          description: Invoice created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`customerId` does not reference an existing customer.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Invoices]
      operationId: listInvoices
      summary: List invoices with combinable filters
      description: >-
        Newest first (folio descending). Every filter is optional and they
        combine with AND; ranges include both ends.
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InvoiceStatus'
        - name: customerId
          in: query
          schema:
            type: string
            format: uuid
        - name: dueDateFrom
          in: query
          description: Earliest due date, inclusive.
          schema:
            type: string
            format: date
        - name: dueDateTo
          in: query
          description: Latest due date, inclusive.
          schema:
            type: string
            format: date
        - name: minAmount
          in: query
          description: Lowest `total`, inclusive. Compared against `total`, not `balance`.
          schema:
            type: string
            pattern: '^\d+\.\d{2}$'
        - name: maxAmount
          in: query
          description: Highest `total`, inclusive. Compared against `total`, not `balance`.
          schema:
            type: string
            pattern: '^\d+\.\d{2}$'
        - name: cursor
          in: query
          description: Opaque cursor from a previous page's `nextCursor`.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A page of invoices, stable under concurrent inserts (R8).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /invoices/{invoiceId}:
    parameters:
      - name: invoiceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Invoices]
      operationId: getInvoice
      summary: Get an invoice by id
      responses:
        '200':
          description: The invoice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /invoices/{invoiceId}/payments:
    parameters:
      - name: invoiceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Payments]
      operationId: createPayment
      summary: Register a payment against an invoice
      description: |
        If `amount` exceeds the invoice's pending balance, the excess is not
        rejected: it is applied up to the balance and the rest becomes credit
        on the customer (`creditAmount`), per R5. Credit is tracked but not
        auto-applied to other invoices in this version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreateRequest'
            example:
              amount: '1160.00'
      responses:
        '201':
          description: Payment registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The invoice is `CANCELLED` (R4).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://github.com/dev-eduardo-gomez/zyncro-api/blob/main/docs/errors.md#invoice-cancelled
                title: Invoice is cancelled
                status: 409
                detail: Cannot register a payment on a cancelled invoice.
                instance: /invoices/8f14e45f-ceea-467f-a0e6-1b3c4d5e6f70/payments
                timestamp: '2026-11-02T18:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Payments]
      operationId: listInvoicePayments
      summary: List payments registered against an invoice
      responses:
        '200':
          description: All payments for the invoice, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by `POST /auth/login`.

  schemas:
    Role:
      type: string
      enum: [MAKER, CHECKER, ADMIN]
      description: |
        MAKER creates operations, CHECKER approves them (never their own),
        ADMIN manages configuration and users.

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          writeOnly: true

    AccessToken:
      type: object
      required: [accessToken, tokenType, expiresIn]
      additionalProperties: false
      properties:
        accessToken:
          type: string
          description: Signed JWT whose claims are `sub`, `email`, `role`, `iat` and `exp`.
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          minimum: 1
          description: Token lifetime in seconds.

    AuthenticatedUser:
      type: object
      required: [id, email, role]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'

    Money:
      type: string
      description: |
        Decimal amount as a string (never a JSON number) so precision survives
        request -> database -> response without binary floating-point drift (R1).
      pattern: '^\d+\.\d{2}$'
      examples: ['1000.00']

    Customer:
      type: object
      required:
        - id
        - taxId
        - legalName
        - address
        - contactEmail
        - creditDays
        - creditBalance
        - createdAt
        - updatedAt
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        taxId:
          type: string
          description: Generic tax identifier. No country-specific format is enforced.
          minLength: 1
          maxLength: 50
        legalName:
          type: string
          minLength: 1
        address:
          type: string
          description: Single free-text line for V1; no country-specific address shape.
          minLength: 1
        contactEmail:
          type: string
          format: email
        creditDays:
          type: integer
          minimum: 0
          description: Days of credit granted; used to compute an invoice's `dueDate`.
        creditBalance:
          $ref: '#/components/schemas/Money'
          description: |
            Credit accumulated from overpayments (R5). Read-only; only grows in
            this version — applying it to future invoices is not automated yet.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CustomerCreateRequest:
      type: object
      required: [taxId, legalName, address, contactEmail, creditDays]
      additionalProperties: false
      properties:
        taxId:
          type: string
          minLength: 1
          maxLength: 50
        legalName:
          type: string
          minLength: 1
        address:
          type: string
          minLength: 1
        contactEmail:
          type: string
          format: email
        creditDays:
          type: integer
          minimum: 0

    CustomerUpdateRequest:
      type: object
      description: 'All fields optional; `taxId` is immutable and not accepted here.'
      additionalProperties: false
      properties:
        legalName:
          type: string
          minLength: 1
        address:
          type: string
          minLength: 1
        contactEmail:
          type: string
          format: email
        creditDays:
          type: integer
          minimum: 0

    InvoiceStatus:
      type: string
      description: Persisted statuses. `PARTIAL` and `DUE_SOON` are derived, never persisted (see `Invoice.derivedStatus`).
      enum: [PENDING, PAID, OVERDUE, CANCELLED, DISPUTED]

    InvoiceDerivedStatus:
      type: [string, 'null']
      description: |
        Overlay computed at read time, never persisted. `PARTIAL` when some but
        not all of the total has been paid; `DUE_SOON` when `PENDING` and the
        due date is within the #8 reminder window (5 days) but not yet overdue.
        When both apply, `DUE_SOON` wins: the due date is the more urgent fact,
        and `balance` against `total` still shows the partial payment.
        `null` when neither applies.
      enum: [PARTIAL, DUE_SOON, null]

    InvoiceLineItemInput:
      type: object
      required: [description, quantity, unitPrice, taxRate]
      additionalProperties: false
      properties:
        description:
          type: string
          minLength: 1
        quantity:
          type: number
          exclusiveMinimum: 0
          description: At most 4 decimal places.
        unitPrice:
          $ref: '#/components/schemas/Money'
        taxRate:
          type: number
          minimum: 0
          maximum: 1
          description: Fraction with at most 4 decimal places, e.g. `0.16` for 16%. Not a country-specific tax code.

    # Standalone rather than `allOf` over InvoiceLineItemInput: that schema's
    # `additionalProperties: false` would reject `lineTotal` inside an `allOf`.
    InvoiceLineItem:
      type: object
      required: [description, quantity, unitPrice, taxRate, lineTotal]
      additionalProperties: false
      properties:
        description:
          $ref: '#/components/schemas/InvoiceLineItemInput/properties/description'
        quantity:
          $ref: '#/components/schemas/InvoiceLineItemInput/properties/quantity'
        unitPrice:
          $ref: '#/components/schemas/Money'
        taxRate:
          $ref: '#/components/schemas/InvoiceLineItemInput/properties/taxRate'
        lineTotal:
          $ref: '#/components/schemas/Money'
          description: 'quantity * unitPrice rounded half-up to 2 decimals, before tax. Server-computed.'

    InvoiceCreateRequest:
      type: object
      required: [customerId, currency, lineItems]
      additionalProperties: false
      properties:
        customerId:
          type: string
          format: uuid
        currency:
          type: string
          description: ISO 4217 currency code. One currency per invoice; no conversion in V1.
          pattern: '^[A-Z]{3}$'
        lineItems:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/InvoiceLineItemInput'

    Invoice:
      type: object
      required:
        - id
        - customerId
        - folio
        - currency
        - lineItems
        - subtotal
        - tax
        - total
        - balance
        - status
        - derivedStatus
        - dueDate
        - createdAt
        - updatedAt
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        folio:
          type: integer
          minimum: 1
          description: Sequential, unique under concurrent creation (R3). No prefix.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        lineItems:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/InvoiceLineItem'
        subtotal:
          $ref: '#/components/schemas/Money'
          description: 'Sum of lineTotal (R2). Exact, no further rounding.'
        tax:
          $ref: '#/components/schemas/Money'
          description: 'sum(lineTotal * taxRate), rounded half-up to 2 decimals once per invoice (R2).'
        total:
          $ref: '#/components/schemas/Money'
          description: 'subtotal + tax (R2). Exact, no further rounding.'
        balance:
          $ref: '#/components/schemas/Money'
          description: Pending amount; total minus applied payments. Never negative (R5).
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        derivedStatus:
          $ref: '#/components/schemas/InvoiceDerivedStatus'
        dueDate:
          type: string
          format: date
          description: "Creation date (UTC) plus the customer's `creditDays` at creation time."
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    InvoicePage:
      type: object
      required: [items, nextCursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'
        nextCursor:
          type: [string, 'null']
          description: Opaque; pass back as `cursor` for the next page. `null` on the last page.

    PaymentCreateRequest:
      type: object
      required: [amount]
      additionalProperties: false
      properties:
        amount:
          type: string
          description: Amount the customer paid, as a decimal string. Must be greater than zero; `0.00` is a validation error.
          pattern: '^(?!0+\.00$)\d+\.\d{2}$'
          examples: ['1160.00']
        proofUrl:
          type: string
          format: uri
          description: Optional link to a payment proof (feeds #9's reconciliation later).

    Payment:
      type: object
      required: [id, invoiceId, amount, appliedAmount, creditAmount, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        invoiceId:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'
          description: Amount the customer actually paid.
        appliedAmount:
          $ref: '#/components/schemas/Money'
          description: Portion applied to the invoice's balance.
        creditAmount:
          $ref: '#/components/schemas/Money'
          description: 'Excess over the pending balance, if any (R5). "0.00" when there is none.'
        proofUrl:
          type: [string, 'null']
          format: uri
        createdAt:
          type: string
          format: date-time

    ProblemDetails:
      type: object
      description: RFC 9457 Problem Details plus the `instance` and `timestamp` extensions.
      required: [type, title, status, detail, instance, timestamp]
      properties:
        type:
          type: string
          format: uri-reference
          description: '`about:blank`, or a URI under `https://github.com/dev-eduardo-gomez/zyncro-api/blob/main/docs/errors.md`.'
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          description: Request path that produced the problem.
        timestamp:
          type: string
          format: date-time

    InvalidField:
      type: object
      required: [field, detail]
      additionalProperties: false
      properties:
        field:
          type: string
          description: Dot-separated path of the invalid property (for example `address.zipCode`).
        detail:
          type: string

    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [errors]
          properties:
            type:
              const: https://github.com/dev-eduardo-gomez/zyncro-api/blob/main/docs/errors.md#validation
            status:
              const: 400
            errors:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/InvalidField'

  responses:
    ValidationFailed:
      description: The request body or parameters failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
          example:
            type: https://github.com/dev-eduardo-gomez/zyncro-api/blob/main/docs/errors.md#validation
            title: Request validation failed
            status: 400
            detail: The request contains invalid fields.
            instance: /auth/login
            timestamp: '2026-10-28T18:00:00.000Z'
            errors:
              - field: email
                detail: email must be an email

    Unauthorized:
      description: Missing, malformed, or expired bearer token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: Unauthorized
            instance: /auth/me
            timestamp: '2026-10-28T18:00:00.000Z'

    NotFound:
      description: No resource exists at this id.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: No resource exists at this id.
            instance: /customers/8f14e45f-ceea-467f-a0e6-1b3c4d5e6f70
            timestamp: '2026-11-02T18:00:00.000Z'

    InternalError:
      description: Unexpected server failure. Internals are logged, never returned.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: about:blank
            title: Internal Server Error
            status: 500
            detail: An unexpected error occurred.
            instance: /auth/me
            timestamp: '2026-10-28T18:00:00.000Z'
